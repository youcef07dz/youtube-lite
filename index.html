<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Player</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;background:#000;overflow:hidden}
iframe{display:block;width:100%;height:100%;border:0}
</style>
</head>
<body>
<iframe id="p" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>
<noscript><p style="color:#888;font:14px sans-serif;text-align:center;padding:20px">Enable JavaScript to play videos</p></noscript>
<script>
(function(){
  try{
    var v='',s=location.search||location.hash;
    if(s&&s.length>2){
      s=s.substring(1);
      var parts=s.split('&');
      for(var i=0;i<parts.length;i++){
        var kv=parts[i].split('=');
        if(kv.length>1&&kv[0]=='v'){
          try{v=decodeURIComponent(kv[1])}catch(e){v=kv[1]}
          v=v.replace(/[#\/\?].*/,'').replace(/[^a-zA-Z0-9_\-]/g,'');
          break;
        }
      }
    }
    if(v){
      var f=document.getElementById('p');
      if(f)f.src='https://www.youtube.com/embed/'+v+'?autoplay=1&rel=0';
    }
  }catch(e){}
})();
</script>
</body>
</html>
